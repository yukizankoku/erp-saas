name: db-provision-roles

# Membuat/memperbarui role `app_runtime` (non-superuser, tanpa BYPASSRLS) di branch Neon `production` — issue #34,
# ADR 0004, docs/runbooks/db-roles.md. Disetujui PO 25 Nov 2026 (gerbang perubahan model keamanan).
# Setiap run WAJIB disetujui PO lewat GitHub Environment `db-production` (required reviewer).
# Secret: NEON_API_KEY (repo) dan APP_RUNTIME_DB_PASSWORD (environment db-production; huruf/angka, >= 24 karakter).

on:
  workflow_dispatch:
  push:
    branches: [ops/provision-db-roles]

concurrency:
  group: db-provision-roles
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: db-production
    env:
      NEON_PROJECT_ID: withered-waterfall-79816375
      NEON_BRANCH: production
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang Neon CLI (versi dikunci) & cek psql
        run: |
          npm i -g neon@9.9.6
          command -v psql || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql --version

      - name: Provisioning & verifikasi app_runtime
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          APP_RUNTIME_DB_PASSWORD: ${{ secrets.APP_RUNTIME_DB_PASSWORD }}
        run: |
          set +x
          [ -n "$NEON_API_KEY" ] || { echo "::error::Secret NEON_API_KEY belum diatur"; exit 1; }
          python3 - <<'PY'
          import os, re, sys
          pw = os.environ.get("APP_RUNTIME_DB_PASSWORD", "")
          if len(pw) < 24 or not re.fullmatch(r"[A-Za-z0-9]+", pw):
              print("::error::APP_RUNTIME_DB_PASSWORD (environment db-production) harus huruf/angka, minimal 24 karakter")
              sys.exit(1)
          PY

          owner_direct=$(neon connection-string "$NEON_BRANCH" --project-id "$NEON_PROJECT_ID")
          owner_pooled=$(neon connection-string "$NEON_BRANCH" --project-id "$NEON_PROJECT_ID" --pooled)
          # Pecah URL: password hanya lewat env PGPASSWORD, URL tanpa password di argv (tidak disimpan ke GITHUB_ENV).
          eval "$(python3 - "$owner_direct" "$owner_pooled" <<'PY'
          import shlex, sys, urllib.parse as u
          def parts(name, url):
              s = u.urlsplit(url)
              host = s.hostname + (f":{s.port}" if s.port else "")
              base = u.urlunsplit(s._replace(netloc=host))
              print("echo " + shlex.quote(f"::add-mask::{s.password or ''}"))
              print(f"{name}_PW={shlex.quote(s.password or '')}")
              print(f"{name}_USER={shlex.quote(s.username or '')}")
              print(f"{name}_URL={shlex.quote(base)}")
          parts("DIRECT", sys.argv[1]); parts("POOLED", sys.argv[2])
          PY
          )"

          owner_sql() { PGPASSWORD="$DIRECT_PW" PGUSER="$DIRECT_USER" psql "$DIRECT_URL" -X "$@"; }
          owner=$(owner_sql -tAc "SELECT current_user")
          dbname=$(owner_sql -tAc "SELECT current_database()")
          echo "owner=$owner database=$dbname branch=$NEON_BRANCH"

          # Password dibaca SQL lewat \getenv APP_RUNTIME_DB_PASSWORD (bukan argv).
          owner_sql -q -v owner="$owner" -v dbname="$dbname" -f infra/sql/app_runtime.sql
          echo "Provisioning selesai."

          owner_sql -c "
            SELECT r.rolname, r.rolcanlogin, r.rolsuper, r.rolbypassrls, r.rolcreaterole, r.rolcreatedb,
                   r.rolreplication,
                   ARRAY(SELECT g.rolname FROM pg_roles g WHERE g.oid <> r.oid
                         AND pg_has_role(r.oid, g.oid, 'MEMBER') AND (g.rolsuper OR g.rolbypassrls))
                     AS privileged_memberships,
                   has_schema_privilege(r.oid, 'public', 'CREATE') AS runtime_can_create
            FROM pg_roles r WHERE r.rolname = 'app_runtime';"

          for kind in DIRECT POOLED; do
            url_var="${kind}_URL"
            row=$(PGPASSWORD="$APP_RUNTIME_DB_PASSWORD" PGUSER=app_runtime psql "${!url_var}" -X -tA -F '|' -c \
              "SELECT current_user, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user")
            echo "login app_runtime ($kind) → $row"
            [ "$row" = "app_runtime|f|f" ] || { echo "::error::$kind tidak sesuai (harus app_runtime|f|f)"; exit 1; }
          done
