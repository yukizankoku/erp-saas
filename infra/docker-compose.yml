# Lingkungan dev lokal — meniru Fase VPS (PRD §6.5).
# Jalankan: docker compose -f infra/docker-compose.yml up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_dev_only
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
